<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ground station</title>

<style>
:root{
  --bg:#0a0e13;--panel:#111821;--panel2:#0d131a;--line:#222d3a;--line2:#2c3a4b;--text:#e6edf3;--dim:#8b9bb0;--faint:#5d6b7d;
  --ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff;--yellow:#e3b341;
  --c-roll:#58a6ff;--c-pitch:#f0883e;--c-yaw:#3fb950;--c-sp:#c9d1d9;--c-m1:#58a6ff;--c-m2:#f0883e;--c-m3:#3fb950;--c-m4:#db61a2;
  --c-thr:#e6edf3;--c-bat:#e3b341;--c-rtt:#39c5cf;--c-delay:#a371f7;--c-drop:#f85149;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line2);background:#16202b;border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:#3d5068;background:#1a2632}
button:disabled{opacity:.42;cursor:default}
button.primary{background:#1f4a7a;border-color:#2f6db0}
button.on{background:#1f3a5a;border-color:var(--accent)}
select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:5px 7px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.faint{color:var(--faint)}.okc{color:var(--ok)}.warnc{color:var(--warn)}.badc{color:var(--bad)}
kbd{display:inline-block;min-width:1.6em;padding:0 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:var(--panel2);font:12px/1.5 inherit;text-align:center}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto 1fr}
#bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;min-width:0}
#bar .brand{font-weight:700;letter-spacing:.2px;margin-right:6px;display:flex;align-items:center;gap:8px}
#bar .brand svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.off{background:var(--faint)}
.batbar{width:34px;height:12px;border:1px solid var(--dim);border-radius:3px;position:relative;padding:1px}
.batbar::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--dim);border-radius:0 1px 1px 0}
.batbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:1px}
#bar .grow{flex:1;min-width:8px}
#state.armed{background:#4a1214;border-color:var(--bad);color:#ffb3b0;font-weight:700}
#msg{min-height:30px;padding:5px 12px;text-align:center;font-weight:600;border-bottom:1px solid var(--line);transition:background .2s}
#msg.info{color:var(--dim)}#msg.warn{background:#3a2a07;color:#ffd479}#msg.bad{background:#4a1214;color:#ffb3b0}#msg.ok{color:var(--ok)}

#main{display:grid;grid-template-columns:292px minmax(420px,1fr) 372px;gap:10px;padding:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
#flightCol{overflow-y:auto;scrollbar-width:thin}
#flightCol>*{flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}

/* flight column */
#hz{display:block;width:100%;aspect-ratio:1;border-radius:10px}
#att{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
#att b{display:block;font-size:17px;font-weight:600}
#att span{font-size:11px;color:var(--dim)}
#sticks{display:block;width:100%;height:118px}
#inputInfo{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
#armRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#arm{height:58px;font-weight:700;position:relative;overflow:hidden}
#arm .fill{position:absolute;inset:0;width:0;background:#2a4d2e}
#arm span,#arm small,#kill span,#kill small{position:relative;display:block}
#arm small,#kill small{font-weight:500;font-size:11px;opacity:.8}
#arm.armed{background:#5a1d1d;border-color:var(--bad)}
#kill{height:58px;font-weight:800;font-size:18px;background:#b42318;border-color:#ff6b5e;color:#fff;letter-spacing:.5px}
#kill:hover{background:#c92a1c}
#trimBox{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
#trimPad{display:grid;grid-template-columns:30px 30px 30px;grid-template-rows:26px 26px 26px;gap:2px}
#trimPad button{padding:0;font-size:12px;border-radius:6px}
#trimVals{font-size:13px;font-variant-numeric:tabular-nums}
#trimVals.set b{color:var(--yellow)}
#flipCard{display:none}
body.flips #hz{max-width:210px;margin:0 auto}
#flipBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#flipBtns button{padding:7px 0;font-size:15px}
#flipTable input{width:84px;padding:3px 6px;text-align:right}
#flipTable input.changed{border-color:var(--yellow);color:var(--yellow)}
#flipTable input.pending{border-color:var(--accent)}
#flipTable td{padding:2px 4px;font-size:13px;color:#c8d1db}

/* plots */
#plotCard{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:6px}
.tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tabs button{padding:4px 10px;font-size:13px;border-radius:7px;background:transparent;border-color:transparent;color:var(--dim)}
.tabs button.on{background:#1b2836;border-color:var(--line2);color:var(--text)}
#plots{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;margin-top:6px}
#plots canvas{flex:1;min-height:0;width:100%;display:block;border-radius:8px;background:var(--panel2)}
#plotTools{display:flex;gap:6px;align-items:center;margin-left:auto}
#plotTools button{padding:3px 9px;font-size:12px}
#plotNote{font-size:12px;color:var(--warn);margin-top:4px;display:none}
#ticker{height:104px;overflow:hidden;font-size:12px;padding:8px 12px}
#ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.55}

/* side panels */
#side{min-height:0}
#side .tabs{padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
#side .tabs button{padding:4px 6px}
#panels{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.panel{display:none}.panel.on{display:block}
.panel h4{margin:14px 0 6px;font-size:13px;color:var(--dim);font-weight:600}
.panel h4:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;color:#c8d1db}
.row .val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.note{font-size:12px;color:var(--dim);margin:6px 0}
.warnbox{background:#3a2a07;border:1px solid #6b4f12;color:#ffd479;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.badbox{background:#3d1214;border:1px solid #7a2a2a;color:#ffb3b0;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
table{border-collapse:collapse;width:100%}
td,th{padding:3px 4px;text-align:left}
th{font-size:12px;color:var(--dim);font-weight:600}
#padView{display:block;width:100%;height:150px;background:var(--panel2);border-radius:8px}
#bindTable td{border-top:1px solid var(--line);padding:5px 4px}
#bindTable td:last-child{text-align:right}
#bindTable button{padding:2px 8px;font-size:12px}
#bindTable tr.learn td{background:#1f3a5a}
.binding{display:inline-block;min-width:34px;padding:1px 7px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);text-align:center;font-size:12px}
#gainTable input{width:100%;min-width:56px;padding:3px 6px;text-align:right}
#gainTable td{padding:2px 4px}
#gainTable th.grp{padding-top:10px;text-align:left;color:var(--dim);border-bottom:1px solid var(--line)}
#gainTable input.changed{border-color:var(--yellow);color:var(--yellow)}
#gainTable input.pending{border-color:var(--accent)}
#gainTable td.ax{color:var(--dim);font-weight:600}
#motorSvg{display:block;width:100%;max-width:300px;margin:4px auto}
#motorSvg .motor{cursor:pointer}
#motorSvg .motor:hover circle.ring{stroke:#8fbfff}
#motorSvg.disabled .motor{cursor:not-allowed;opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
#motorSvg .blade{transform-box:fill-box;transform-origin:center}
#motorSvg .spin.cw .blade{animation:spin .35s linear infinite}
#motorSvg .spin.ccw .blade{animation:spinr .35s linear infinite}
#recList .rec{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:6px 0;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
#recList .rec small{color:var(--dim)}
#recList .rec .btns{display:flex;gap:4px}
#recList .rec button{padding:2px 8px;font-size:12px}
#logList{font-size:12px;font-variant-numeric:tabular-nums}
#logList div{padding:3px 0;border-bottom:1px solid #18212c;display:grid;grid-template-columns:62px 1fr;gap:6px}
#logList .t{color:var(--faint)}
.lvl-warn{color:#ffd479}.lvl-bad{color:#ffb3b0}.lvl-ok{color:#7ee787}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:4px 0;font-size:13px}
dt{color:var(--dim)}dd{margin:0;font-variant-numeric:tabular-nums}

#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0a0e13d9;z-index:5}
#overlay .box{max-width:520px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px 20px;text-align:center}
#overlay h2{margin:.1em 0 .5em;font-size:20px}

@media (max-height:820px){
  #hz{max-width:210px;margin:0 auto}
  #sticks{height:96px}
}
@media (max-width:1240px){
  #app{position:static;min-height:100%}
  #main{grid-template-columns:270px minmax(380px,1fr)}
  #flightCol{overflow:visible}
  #plotCard{flex:none;height:640px}
  #side{grid-column:1/-1;height:620px}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.6"><circle cx="5" cy="5" r="3"/><circle cx="19" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M7.2 7.2l9.6 9.6M16.8 7.2l-9.6 9.6"/><rect x="9.5" y="9.5" width="5" height="5" rx="1" fill="#58a6ff"/></svg><span data-t="title"></span></span>
    <span class="pill" id="conn"><span class="dot" id="cdot"></span><span id="ctext"></span></span>
    <span class="pill" id="bat"><span class="batbar"><i id="batFill"></i></span><span id="batText"></span></span>
    <span class="pill" id="state"></span>
    <span class="pill" id="timer" title=""><span>⏱</span><span id="timerText" class="num">0:00</span></span>
    <span class="grow"></span>
    <span class="pill" id="padPill"><span class="dot" id="padDot"></span><span id="padText"></span></span>
    <button id="soundBtn" title=""></button>
    <button id="lang"></button>
  </div>
  <div id="msg" class="info"></div>
  <div id="main">
    <div class="col" id="flightCol">
      <div class="card">
        <h3><span data-t="attitude"></span><span class="grow"></span><span id="hdg" class="num"></span></h3>
        <canvas id="hz" width="268" height="268"></canvas>
        <div id="att"><div><b id="aRoll">–</b><span data-t="roll"></span></div><div><b id="aPitch">–</b><span data-t="pitch"></span></div><div><b id="aThr">–</b><span data-t="thrust"></span></div></div>
      </div>
      <div id="armRow">
        <button id="arm" disabled><div class="fill"></div><span data-t="notReady"></span><small id="armHint"></small></button>
        <button id="kill"><span data-t="kill"></span><small id="killHint"></small></button>
      </div>
      <div class="card" id="flipCard">
        <h3><span data-t="flipTitle"></span><span class="grow"></span><span id="flipCardNote" class="faint" style="text-transform:none;letter-spacing:0"></span></h3>
        <div id="flipBtns">
          <button data-flip="2" data-ta="aFlipLeft">◀</button><button data-flip="0" data-ta="aFlipForward">▲</button>
          <button data-flip="1" data-ta="aFlipBack">▼</button><button data-flip="3" data-ta="aFlipRight">▶</button>
        </div>
      </div>
      <div class="card">
        <h3><span data-t="pilotInput"></span><span class="grow"></span><span id="ratesPill" class="num"></span></h3>
        <canvas id="sticks" width="268" height="118"></canvas>
        <div id="inputInfo"><span id="inLeft"></span><span id="inRight"></span></div>
      </div>
      <div class="card">
        <h3><span data-t="trim"></span><span class="grow"></span><span id="trimHint" class="faint"></span></h3>
        <div id="trimBox">
          <div id="trimPad">
            <span></span><button data-ax="p" data-d="1" data-ta="trimUp">▲</button><span></span>
            <button data-ax="r" data-d="-1" data-ta="trimLeft">◀</button><button id="trimZero" data-ta="trimZeroHint">0</button><button data-ax="r" data-d="1" data-ta="trimRight">▶</button>
            <span></span><button data-ax="p" data-d="-1" data-ta="trimDown">▼</button><span></span>
          </div>
          <div>
            <div id="trimVals"><b id="trimR">–</b> <span class="dim" data-t="rollShort"></span> · <b id="trimP">–</b> <span class="dim" data-t="pitchShort"></span></div>
            <button id="level" style="margin-top:6px;width:100%" data-t="level"></button>
            <div id="levelHint" class="faint" style="font-size:11px;margin-top:3px;text-align:center"></div>
          </div>
        </div>
      </div>

    </div>

    <div class="col" id="center">
      <div class="card" id="plotCard">
        <div class="tabs" id="plotTabs">
          <button data-set="flight" data-t="plotFlight"></button>
          <button data-set="tuning" data-t="plotTuning"></button>
          <button data-set="link" data-t="plotLink"></button>
          <div id="plotTools">
            <select id="plotWin" title=""><option value="5">5 s</option><option value="10">10 s</option><option value="20">20 s</option><option value="60">60 s</option></select>
            <button id="freeze" data-t="freeze"></button>
          </div>
        </div>
        <div id="plotNote"></div>
        <div id="plots"></div>
      </div>
      <div class="card" id="ticker"></div>
    </div>

    <div class="col" id="side">
      <div class="tabs" id="panelTabs">
        <button data-panel="pad" data-t="pController"></button>
        <button data-panel="tune" data-t="pTuning"></button>
        <button data-panel="motors" data-t="pMotors"></button>
        <button data-panel="rec" data-t="pRecorder"></button>
        <button data-panel="log" data-t="pLog"></button>
        <button data-panel="drone" data-t="pDrone"></button>
      </div>
      <div id="panels">
        <!-- controller -->
        <div class="panel" id="panel-pad">
          <h4 data-t="device"></h4>
          <div class="row"><select id="padSelect" style="flex:1"></select></div>
          <div class="note" id="padNote"></div>
          <canvas id="padView" width="340" height="150"></canvas>
          <h4 data-t="flying"></h4>
          <div class="row"><label data-t="mode"></label><select id="setMode"><option value="2" data-t="mode2"></option><option value="1" data-t="mode1"></option></select></div>
          <div class="row"><label data-t="throttleSrc"></label><select id="setThrottle"><option value="spring" data-t="thrSpring"></option><option value="trigger" data-t="thrTrigger"></option><option value="full" data-t="thrFull"></option></select></div>
          <div class="row"><label data-t="rates"></label><select id="setRates"><option value="0" data-t="rateBeginner"></option><option value="1" data-t="rateNormal"></option><option value="2" data-t="rateSport"></option></select></div>
          <div class="row"><label data-t="thrMin"></label><input type="range" id="setThrMin" min="0" max="50" step="1" style="width:120px"><span class="val" id="vThrMin"></span></div>
          <div class="row"><label data-t="thrMax"></label><input type="range" id="setThrMax" min="50" max="100" step="1" style="width:120px"><span class="val" id="vThrMax"></span></div>
          <div class="row"><label data-t="expoRP"></label><input type="range" id="setExpo" min="0" max="0.8" step="0.05" style="width:120px"><span class="val" id="vExpo"></span></div>
          <div class="row"><label data-t="expoYaw"></label><input type="range" id="setExpoYaw" min="0" max="0.8" step="0.05" style="width:120px"><span class="val" id="vExpoYaw"></span></div>
          <div class="row"><label data-t="deadzone"></label><input type="range" id="setDead" min="0" max="0.25" step="0.01" style="width:120px"><span class="val" id="vDead"></span></div>
          <div class="note" data-t="thrNote"></div>
          <div class="row" style="justify-content:flex-end"><button id="hoverFit" data-t="hoverFit"></button></div>
          <h4 data-t="buttons"></h4>
          <table id="bindTable"></table>
          <div class="row" style="justify-content:flex-end"><button id="bindReset" data-t="bindReset"></button></div>
          <h4 data-t="feedback"></h4>
          <div class="row"><label><input type="checkbox" id="setRumble"> <span data-t="rumble"></span></label><button id="rumbleTest" data-t="test"></button></div>
          <div class="row"><label><input type="checkbox" id="setSound"> <span data-t="sounds"></span></label></div>
          <div class="row"><label><input type="checkbox" id="setVoice"> <span data-t="voice"></span></label></div>
          <div class="row"><label><input type="checkbox" id="setBlurPause"> <span data-t="blurPause"></span></label></div>
          <div class="row"><label><input type="checkbox" id="setKeyboard"> <span data-t="keyboardFly"></span></label></div>
          <div class="note" data-h="keyboardHelp"></div>
          <h4 data-t="experimental"></h4>
          <div class="row"><label><input type="checkbox" id="setFlips"> <span data-t="flipsSetting"></span></label></div>
          <div class="note" data-t="flipsWarn"></div>
        </div>

        <!-- tuning -->
        <div class="panel" id="panel-tune">
          <div class="note" data-h="tuneIntro"></div>
          <div id="tuneOld" class="warnbox" style="display:none" data-t="needsV3"></div>
          <table id="gainTable"></table>
          <div class="row"><label><input type="checkbox" id="linkRP"> <span data-t="linkRP"></span></label></div>
          <div class="row"><label><input type="checkbox" id="liveGains"> <span data-t="liveGains"></span></label></div>
          <div class="grid2" style="margin-top:8px">
            <button id="gainApply" class="primary" data-t="apply"></button>
            <button id="gainRead" data-t="readDrone"></button>
            <button id="gainSave" data-t="saveDrone"></button>
            <button id="gainReset" data-t="resetDefaults"></button>
          </div>
          <div class="note" id="gainState"></div>
          <h4 data-t="stepTitle"></h4>
          <div class="grid2"><button id="stepRollBtn" data-t="stepRoll"></button><button id="stepPitchBtn" data-t="stepPitch"></button></div>
          <div class="row"><label data-t="stepAmp"></label><input type="range" id="stepDeg" min="2" max="10" step="1" style="width:140px"><span class="val" id="vStepDeg"></span></div>
          <div class="row"><label><input type="checkbox" id="stepHoldBox"> <span data-t="stepHold"></span></label></div>
          <div class="note" id="stepHelp"></div>
          <div id="flipParams" style="display:none">
            <h4 data-t="flipParamsTitle"></h4>
            <table id="flipTable"></table>
            <div class="note" id="flipParamsNote"></div>
          </div>
          <h4 data-t="tuneHowTitle"></h4>
          <div class="note" data-h="tuneHow"></div>
        </div>

        <!-- motor test -->
        <div class="panel" id="panel-motors">
          <div class="badbox" data-h="propsWarn"></div>
          <div id="motorOld" class="warnbox" style="display:none"></div>
          <div class="row"><label><input type="checkbox" id="propsOff"> <b data-t="propsOff"></b></label></div>
          <svg id="motorSvg" viewBox="0 0 300 300"></svg>
          <div class="row"><label data-t="power"></label><input type="range" id="mtPower" min="5" max="30" step="1" style="width:140px"><span class="val" id="vMtPower"></span></div>
          <div class="row"><label data-t="duration"></label><input type="range" id="mtTime" min="500" max="3000" step="250" style="width:140px"><span class="val" id="vMtTime"></span></div>
          <div class="grid2"><button id="mtAll" data-t="allMotors"></button><button id="mtStop" data-t="stopMotors"></button></div>

class Series {
  constructor(cap) { this.cap = cap; this.t = new Float64Array(cap); this.v = new Float32Array(cap); this.len = 0; this.head = 0; }
  push(t, v) {
    this.t[this.head] = t; this.v[this.head] = v;
    this.head = (this.head + 1) % this.cap;
    if (this.len < this.cap) this.len++;
  }
  idx(k) { return (this.head - this.len + k + this.cap) % this.cap; }   // k-th oldest
  last() { return this.len ? this.v[this.idx(this.len - 1)] : NaN; }
  lastT() { return this.len ? this.t[this.idx(this.len - 1)] : -Infinity; }
  lowerBound(a) {            // first k with t >= a
    let lo = 0, hi = this.len;
    while (lo < hi) { const m = (lo + hi) >> 1; if (this.t[this.idx(m)] < a) lo = m + 1; else hi = m; }
    return lo;
  }
  forEach(a, b, fn) {
    for (let k = this.lowerBound(a); k < this.len; k++) {
      const i = this.idx(k), tt = this.t[i];
      if (tt > b) break;
      fn(tt, this.v[i]);
    }
  }
  at(tq) {                   // value of the newest sample at or before tq
    const k = this.lowerBound(tq + 1e-6) - 1;
    return k >= 0 ? this.v[this.idx(k)] : NaN;
  }
  clear() { this.len = 0; this.head = 0; }
}

const audio = { ctx: null };
function audioCtx() {
  if (!audio.ctx) {

  }
  if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume().catch(() => {});
  return audio.ctx;
}

function beep(notes) {          // notes: [freq Hz, duration ms, pause ms]
  if (!settings.sound) return;
  const ctx = audioCtx();
  if (!ctx || ctx.state !== "running") return;
  let at = ctx.currentTime + 0.01;
  for (const [f, d, p] of notes) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.09, at + 0.01);
    g.gain.setValueAtTime(0.09, at + d / 1000 - 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + d / 1000);
    o.connect(g).connect(ctx.destination);
    o.start(at); o.stop(at + d / 1000 + 0.02);
    at += (d + (p || 40)) / 1000;
  }
}

  const h = (settings.drone || DEFAULTS.drone).trim();

}
function connect() {

  if (link.ws) { try { link.ws.onclose = null; link.ws.close(); } catch (e) { /* closed */ } }
  link.address = (settings.drone || DEFAULTS.drone).trim();
  let ws;
  try { ws = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
  link.ws = ws;

    link.open = true; link.reconnectDelay = 250; link.lastTel = now(); link.offset = null; link.lastFastSeq = null;
    const b = new DataView(new ArrayBuffer(8));
    b.setUint8(0, MSG.HELLO); b.setUint8(1, PROTO); b.setUint32(4, link.token, true);
    ws.send(b.buffer);
    const s = new Uint8Array([MSG.STREAM, 1, 0, 0]);     // FAST samples; old firmware ignores it
    ws.send(s.buffer);
  };

    if (typeof ev.data === "string") {
      try { const j = JSON.parse(ev.data); if (j.t === "info") onInfo(j); } catch (e) { /* not JSON */ }
      return;
    }
    const v = new DataView(ev.data);
    if (v.byteLength < 1) return;
    const type = v.getUint8(0);
    if (type === MSG.TELEMETRY && v.byteLength >= TELEMETRY_LEN) onTelemetry(v);
    else if (type === MSG.FAST) onFast(v);
    else if (type === MSG.PARAM_REPLY) onParamReply(v);
    else if (type === MSG.MOTOR_REPLY) onMotorReply(v);
    else if (type === MSG.FLIP_REPLY) onFlipReply(v);
  };

    const was = link.infoSeen;
    link.open = false; link.ready = false; link.infoSeen = false;
    if (was) { logEvent(t("evDisconnected"), "bad"); ALERTS.linkLost(); }

const proto = () => (link.info && link.info.proto) || 0;

function onInfo(j) {

  logEvent(t("evInfo")(j));

}

// Drone clock -> local clock. Network delay only makes frames later, so the
// smallest (arrival - drone time) is the best estimate; it creeps up slowly
// to follow clock drift.
function droneToLocal(droneMs) {
  const cand = now() - droneMs;
  if (link.offset === null || cand < link.offset) link.offset = cand;
  else link.offset += 0.02;
  return droneMs + link.offset;
}

function onTelemetry(v) {
  if (!link.infoSeen) return;           // telemetry before the answer to HELLO
  const tm = {
    state: v.getUint8(1), stage: v.getUint8(2), armResult: v.getUint8(3), echoSeq: v.getUint16(4, true),
    rxRate: v.getUint16(6, true), echoMs: v.getUint32(8, true), vbat: v.getUint16(12, true) / 1000,
    roll: v.getInt16(14, true) / 100, pitch: v.getInt16(16, true) / 100, yaw: v.getInt16(18, true) / 100,
    thrust: v.getUint16(20, true) / 1000, stale: v.getUint16(22, true), delay: v.getUint16(24, true),
    state2: v.getUint8(26), stopReason: v.getUint8(27), uptime: v.getUint32(28, true), token: v.getUint32(32, true),
    trimR: v.getInt8(36), trimP: v.getInt8(37),
  };
  const tNow = now();
  const prev = link.tel;
  link.prevTel = prev; link.tel = tm; link.lastTel = tNow;

  if (tm.echoMs && r < 10000) {
    link.rtt = link.rtt < 0 ? r : link.rtt * 0.8 + r * 0.2;
    link.rttMin = Math.min(link.rttMin, r); link.rttMax = Math.max(link.rttMax, r);
    sig.rtt.push(tNow, r);

  const tl = droneToLocal(tm.uptime);
  sig.tRoll.push(tl, tm.roll); sig.tPitch.push(tl, tm.pitch); sig.thrOut.push(tl, tm.thrust * 100);
  if (tm.vbat > 0) sig.vbat.push(tl, tm.vbat);

  if (mine) {
    sig.delay.push(tl, tm.delay);
    if (link.prevStale !== null) sig.drop.push(tl, ((tm.stale - link.prevStale) & 0xffff) * 20);
    link.prevStale = tm.stale;

  if (tm.token) { link.token = tm.token; session.set("gs_token", String(tm.token)); }
  telemetryEvents(prev, tm, mine, tNow);

}

let flightStart = 0, lastFlightMs = 0, batLowSaid = 0;
function telemetryEvents(prev, tm, mine, tNow) {
  const wasMine = !!(prev && (prev.state & S_ARMED) && (prev.state & S_YOU));
  const stopText = (tm.stopReason > 1 && t("stopReasons")[tm.stopReason]) || "";
  if (!link.ready) {
    // first telemetry after (re)connect: take over the drone's view of the arm state
    if (armReq && !mine && stopText) toast(stopText, tm.stopReason === STOP_BATTERY ? "bad" : "warn");
    armReq = mine; link.ready = true;
    if (mine) {
      // a session resumed after a reload: only the device it was flown with may go on
      flightStart = flightStart || tNow;
      input.flightSource = settings.keyboard && !input.hadPad ? "keyboard" : "pad";
    }
  } else if (armReq && !mine && tNow - armSince > 600) {
    armReq = false;
    if (wasMine && stopText) toast(stopText, tm.stopReason === STOP_BATTERY ? "bad" : "warn");
    else if (tm.armResult) toast(t("armReasons")[tm.armResult] || "", "warn");
  }
  if (mine && !wasMine && link.ready) {
    flightStart = tNow; logEvent(t("evArmed"), "ok"); ALERTS.armed();
  }
  if (!mine && wasMine) {
    lastFlightMs = tNow - flightStart; flightStart = 0;
    logEvent(t("evStopped")(t("stopReasons")[tm.stopReason] || t("stopReasons")[1]), tm.stopReason > 1 ? "warn" : "info");
    if (tm.stopReason !== 2) ALERTS.disarmed();
  }
  if (mine && prev) {
    if (tm.stage >= 2 && prev.stage < 2) { logEvent(t("evStage")(t("stages")[tm.stage]), "bad"); ALERTS.linkLost(); }
    else if (tm.stage >= 3 && prev.stage === 2) logEvent(t("evStage")(t("stages")[tm.stage]), "bad");
    if (wasMine && tm.stage === 0 && prev.stage >= 2 && prev.stage <= 3) { logEvent(t("evLinkBack"), "ok"); ALERTS.linkBack(); }
    if ((tm.state2 & S2_BAT_LAND) && !(prev.state2 & S2_BAT_LAND)) { logEvent(t("evBatLand"), "bad"); ALERTS.batLand(); }

}

// ===== control frames =========================================================
function sendControl(extraFlags, force) {

  let flags = extraFlags | 0;

  b.setUint8(0, MSG.CONTROL); b.setUint8(1, flags); b.setUint16(2, link.seq, true); b.setUint32(4, ms32(), true);

  b.setInt16(10, Math.round(clamp(c.pitch, -1, 1) * 1000), true);
  b.setInt16(12, Math.round(clamp(c.yaw, -1, 1) * 1000), true);
  b.setUint16(14, Math.round(clamp(c.thrust, 0, 1) * 1000), true);

// ===== parameters (controller gains) ==========================================
const gains = {};            // name -> {value, dflt, writable}

  gainReqId = (gainReqId + 1) & 0xff;

}

}

  const value = v.getFloat32(4, true), dflt = v.getFloat32(8, true), flags = v.getUint8(12);
  const name = new TextDecoder().decode(new Uint8Array(v.buffer, 14));
  const req = pendingParams[id];

  if (op === P_SAVE || op === P_RESET) {
    if (status === 0) {
      toast(op === P_SAVE ? t("gainsSaved") : t("gainsReset"), "ok");
      logEvent(op === P_SAVE ? t("gainsSaved") : t("gainsReset"), "ok");
      if (op === P_RESET) { for (const k in gainEdits) delete gainEdits[k]; readAllGains(); }
    } else toast(t("paramStatus")[status] || "?", "warn");

    return;

// ===== flips (experimental) =====================================================

  else { const why = t("flipReasons")[status] || "?"; toast(why, "warn"); logEvent(`${t("flipGo")(name)}: ${why}`, "warn"); ALERTS.limit(); }

// ===== motor test ===============================================================
const motorTest = { running: 0, until: 0, percent: 0 };
function sendMotorTest(mask, percent, ms) {
  const b = new DataView(new ArrayBuffer(8));
  b.setUint8(0, MSG.MOTOR_TEST); b.setUint8(1, mask); b.setUint8(2, percent); b.setUint16(4, ms, true);
  return send(b.buffer);
}
function onMotorReply(v) {

    const names = [0, 1, 2, 3].filter((m) => mask & (1 << m)).map((m) => `M${m + 1}`).join(" ");

    motorTest.running = 0; $("mtStatus").textContent = t("mtStopped");

// ===== input: gamepads and keyboard ===========================================

  stepPitch: "aStepPitch", flip: "aFlip", roll: "aRoll", pitch: "aPitch",

  ps5: ["✕", "○", "□", "△", "L1", "R1", "L2", "R2", "Create", "Options", "L3", "R3", "↑", "↓", "←", "→", "PS", "Pad"],
  xbox: ["A", "B", "X", "Y", "LB", "RB", "LT", "RT", "View", "Menu", "LS", "RS", "↑", "↓", "←", "→", "Xbox"],

function padInfo(id) {

  if (vid === "054c" || /sony|dualshock|dualsense|playstation/.test(s)) {

  } else if (vid === "057e" || /nintendo|pro controller|joy-con/.test(s)) family = "switch";
  else if (vid === "045e" || /xbox|xinput|microsoft/.test(s)) family = "xbox";

const input = {
  source: "none",          // "pad", "keyboard", "none"
  pad: null, padId: "", padName: "", family: "generic", standard: false, list: [],
  raw: { roll: 0, pitch: 0, yaw: 0, thr: 0 }, travel: 0,   // travel: throttle stick 0..1
  cmd: { roll: 0, pitch: 0, yaw: 0, thrust: 0 },
  buttons: {}, axes: [], btnState: [],
  hadPad: false,
  flightSource: "",        // input source the current flight started with
};
const keys = new Set();
const kb = { thr: 0, roll: 0, pitch: 0 };
const learn = { action: null, base: null, until: 0 };

function defaultBindings() {
  const b = { arm: { k: "b", i: 9 }, stop: { k: "b", i: 1 }, trimUp: { k: "b", i: 12 }, trimDown: { k: "b", i: 13 },
    trimLeft: { k: "b", i: 14 }, trimRight: { k: "b", i: 15 }, rates: { k: "b", i: 3 }, level: { k: "b", i: 2 },
    marker: { k: "b", i: 0 }, stepRoll: { k: "b", i: 5 }, stepPitch: { k: "b", i: 4 }, flip: { k: "b", i: 11 } };
  // standard layout: axes 0/1 left stick, 2/3 right stick, down = +1

  const bt = pad.buttons[b.i];
  return bt ? bt.value : 0;
}

  if (b.k === "b") { const bt = pad.buttons[b.i]; return !!(bt && (bt.pressed || bt.value > 0.5)); }

  if (b.k === "a" && b.dir) return t("axisName")(b.i) + (b.dir > 0 ? "+" : "−");

function pollPads() {
  const all = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter((p) => p && p.connected) : [];
  input.list = all;
  let pad = null;
  if (settings.padKey === "keyboard") pad = null;
  else pad = all.find((p) => p.id === settings.padKey) || all[0] || null;
  const changed = pad && pad.id !== input.padId, lost = !pad && input.pad;
  input.pad = pad;
  if (changed) {

    input.padId = pad.id; input.padName = info.name; input.family = info.family;
    input.standard = pad.mapping === "standard";

    toast(t("padConnectedMsg")(info.name), "info");
  }
  if (lost) { logEvent(t("evPadLost"), "bad"); input.padId = ""; }

function pollInput(tNow, dt) {

// Step test: a doublet on one axis while hovering, for comparing gains.

  step.axis = axis; step.t0 = now();
  step.amp = clamp(settings.stepDeg / ((link.info && link.info.maxAngle) || 15), 0.05, 1);
  plotView.frozen = null; plotView.range = null;
  if (settings.plotSet !== "tuning") { settings.plotSet = "tuning"; buildPlots(); }
  logEvent(t("evStep")(t(axis === "roll" ? "stepRoll" : "stepPitch"), settings.stepDeg));
  renderFreeze();

  c.roll = c.pitch = 0;

  else if (input.source === "none") { text = t("noPad"); cls = "warn"; }
  else if (mine) { text = t("msgFlying"); cls = "ok"; }
  else { text = t("msgIdle")(input.pad ? actionLabel("arm") : t("arm")); cls = "info"; }
  m.textContent = text; m.className = cls;
  // overlay while the window cannot fly
  const ov = $("overlay");
  const showOv = !!paused && (mine || armReq) && paused !== "hidden";
  ov.style.display = showOv ? "flex" : "none";
  if (showOv) $("overlayBox").innerHTML = `<h2 class="badc">⚠</h2><p>${esc(t(paused === "pad" && !input.pad && input.hadPad ? "padLostMsg" : PAUSE_TEXT[paused]))}</p>` +
    (paused === "pad" ? `<p class="dim">${esc(t("padNeeded"))}</p>` : "");
}
function renderFlipCard() {
  const card = $("flipCard");
  card.style.display = settings.flips ? "block" : "none";
  document.body.classList.toggle("flips", !!settings.flips);
  if (!settings.flips) return;
  const ok = flipAllowed();
  card.querySelectorAll("button[data-flip]").forEach((b) => { b.disabled = !ok; });
  $("flipCardNote").textContent = link.infoSeen && proto() < 4 ? t("flipNeedsV4") :
    link.info && proto() >= 4 && !link.info.flip ? t("flipOff") : input.pad ? t("flipHintShort")(actionLabel("flip")) : "";
}
function frame() {
  drawPlots(); drawHorizon(); drawSticks();
  if ($("panel-pad").classList.contains("on")) drawPadView();
  requestAnimationFrame(frame);
}

// ===== wiring ===========================================================================
const mouseArm = { since: 0, timer: 0 };
$("arm").addEventListener("pointerdown", () => {
  if (armReq) { doDisarm(false); return; }
  const why = armBlockReason();
  if (why) { toast(why, "warn"); return; }
  mouseArm.since = now();
  clearTimeout(mouseArm.timer);
  mouseArm.timer = setTimeout(() => { if (mouseArm.since) { mouseArm.since = 0; doArm(); } }, ARM_HOLD_MS);
});
["pointerup", "pointerleave", "pointercancel"].forEach((ev) => $("arm").addEventListener(ev, () => { mouseArm.since = 0; clearTimeout(mouseArm.timer); }));
$("kill").addEventListener("pointerdown", doKill);
document.querySelectorAll("#trimPad button[data-ax]").forEach((b) => b.addEventListener("click", () => trimStep(b.dataset.ax, +b.dataset.d)));
let trimZeroTimer = 0;
$("trimZero").addEventListener("pointerdown", () => {
  clearTimeout(trimZeroTimer);
  trimZeroTimer = setTimeout(() => { if (sendTrim(0, 0)) { ALERTS.tick(); toast(t("trimReset"), "info"); } }, 700);
});
["pointerup", "pointerleave", "pointercancel"].forEach((ev) => $("trimZero").addEventListener(ev, () => clearTimeout(trimZeroTimer)));
$("level").addEventListener("click", startLevel);
document.querySelectorAll("#flipCard button[data-flip]").forEach((b) => b.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (flipAllowed()) doFlip(+b.dataset.flip);
}));
document.querySelectorAll("#plotTabs [data-set]").forEach((b) => b.addEventListener("click", () => {
  settings.plotSet = b.dataset.set; saveSettings(); buildPlots();
}));
$("plotWin").addEventListener("change", (e) => { settings.plotWin = +e.target.value; saveSettings(); });
$("freeze").addEventListener("click", () => {
  plotView.frozen = plotView.frozen === null ? now() - 80 : null;
  plotView.range = null;
  renderFreeze();
});
function showPanel(name) {
  settings.panel = name; saveSettings();
  document.querySelectorAll("#panelTabs [data-panel]").forEach((b) => b.classList.toggle("on", b.dataset.panel === name));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === "panel-" + name));
  if (name === "log") renderLog();
  if (name === "tune" && settings.plotSet !== "tuning" && proto() >= 3) { settings.plotSet = "tuning"; buildPlots(); }
  renderPanels();
}
document.querySelectorAll("#panelTabs [data-panel]").forEach((b) => b.addEventListener("click", () => showPanel(b.dataset.panel)));
// controller settings
$("padSelect").addEventListener("change", (e) => {
  settings.padKey = e.target.value;
  if (settings.padKey === "keyboard") { settings.keyboard = true; $("setKeyboard").checked = true; }
  saveSettings(); input.padId = "_";
});
const bindSetting = (id, key, conv, after) => {
  const el = $(id);
  const show = () => { if (el.type === "checkbox") el.checked = !!settings[key]; else el.value = String(settings[key]); if (after) after(); };
  el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input", () => {
    settings[key] = el.type === "checkbox" ? el.checked : conv(el.value); saveSettings(); show(); renderBindTable(); render();
  });
  show();
};
const pct = (v) => Math.round(v * 100) + " %";
bindSetting("setMode", "mode", Number);
bindSetting("setThrottle", "throttle", String);
bindSetting("setRates", "rates", Number);
bindSetting("setThrMin", "thrMin", Number, () => { $("vThrMin").textContent = settings.thrMin + " %"; });
bindSetting("setThrMax", "thrMax", Number, () => { $("vThrMax").textContent = settings.thrMax + " %"; });
bindSetting("setExpo", "expo", Number, () => { $("vExpo").textContent = pct(settings.expo); });
bindSetting("setExpoYaw", "expoYaw", Number, () => { $("vExpoYaw").textContent = pct(settings.expoYaw); });
bindSetting("setDead", "dead", Number, () => { $("vDead").textContent = pct(settings.dead); });
bindSetting("setRumble", "rumble", Boolean);
bindSetting("setSound", "sound", Boolean);
bindSetting("setVoice", "voice", Boolean);
bindSetting("setBlurPause", "blurPause", Boolean);
bindSetting("setKeyboard", "keyboard", Boolean);
bindSetting("setFlips", "flips", Boolean, () => { renderBindTable(); renderGains(); renderFlipCard(); });
bindSetting("linkRP", "linkRP", Boolean);
bindSetting("liveGains", "liveGains", Boolean);
bindSetting("autoRec", "autoRec", Boolean);
bindSetting("mtPower", "mtPower", Number, () => { $("vMtPower").textContent = settings.mtPower + " %"; });
bindSetting("stepDeg", "stepDeg", Number, () => { $("vStepDeg").textContent = "±" + settings.stepDeg + "°"; });
bindSetting("stepHoldBox", "stepHold", Boolean);
$("stepRollBtn").addEventListener("click", () => startStep("roll"));
$("stepPitchBtn").addEventListener("click", () => startStep("pitch"));
$("hoverFit").addEventListener("click", fitHover);
bindSetting("mtTime", "mtTime", Number, () => { $("vMtTime").textContent = num(settings.mtTime / 1000, 1) + " s"; });
$("plotWin").value = String(settings.plotWin);
$("bindTable").addEventListener("click", (e) => {
  const b = e.target.closest("[data-learn]");
  if (b && !armReq) startLearn(b.dataset.learn);
});
$("bindReset").addEventListener("click", () => {
  delete settings.bindings[input.padId]; saveSettings(); renderBindTable();
});
$("rumbleTest").addEventListener("click", () => { const r = settings.rumble; settings.rumble = true; rumble(400, 1, 1); settings.rumble = r; });
$("soundBtn").addEventListener("click", () => {
  audioCtx();
  const on = !(settings.sound || settings.voice);
  settings.sound = on; settings.voice = on; saveSettings();
  $("setSound").checked = on; $("setVoice").checked = on;
  if (on) beep([[880, 80]]);
  render();
});
// tuning
$("gainApply").addEventListener("click", applyGains);
$("gainRead").addEventListener("click", () => { for (const k in gainEdits) delete gainEdits[k]; readAllGains(); renderGains(); });
$("gainSave").addEventListener("click", () => { applyGains(); setTimeout(() => sendParam(P_SAVE, "", 0), 150); });
$("gainReset").addEventListener("click", () => {
  if (now() < resetArmedUntil) { resetArmedUntil = 0; sendParam(P_RESET, "", 0); $("gainReset").textContent = t("resetDefaults"); return; }
  resetArmedUntil = now() + 3000; $("gainReset").textContent = t("reallyReset");
  setTimeout(() => { $("gainReset").textContent = t("resetDefaults"); }, 3000);
});
// motor test
$("mtAll").addEventListener("click", () => startMotorTest(15));
$("mtStop").addEventListener("click", () => { sendMotorTest(0, 0, 0); motorTest.running = 0; renderMotors(); });
$("propsOff").addEventListener("change", renderMotors);
// recorder and log
$("recBtn").addEventListener("click", () => { if (rec.cur && !rec.cur.auto) recStop(); else if (!rec.cur) recStart(false); });
$("recList").addEventListener("click", (e) => {
  const c = e.target.closest("[data-csv]"), d = e.target.closest("[data-del]");
  if (c) { const r = rec.list.find((x) => x.n === +c.dataset.csv); if (r) recSave(r); }
  if (d) { rec.list = rec.list.filter((x) => x.n !== +d.dataset.del); renderRec(); }
});
$("logSave").addEventListener("click", () => {
  download(`groundstation-log-${stamp(new Date())}.txt`, logEntries.map((e) => `${e.d.toISOString()}  ${e.text}`).join("\n") + "\n");
});
$("logClear").addEventListener("click", () => { logEntries.length = 0; renderLog(); });
// connection
$("addr").value = settings.drone;
const reconnectTo = () => {
  const v = $("addr").value.trim();
  if (!v) return;
  settings.drone = v; saveSettings(); link.reconnectDelay = 250; link.info = null; link.tel = null;
  for (const k in gains) delete gains[k];
  connect();
};
$("addrGo").addEventListener("click", reconnectTo);
$("addr").addEventListener("keydown", (e) => { if (e.key === "Enter") reconnectTo(); });
$("overlay").addEventListener("click", () => { window.focus(); });
$("lang").addEventListener("click", () => {
  lang = lang === "de" ? "en" : "de";
  local.set("gs_lang", lang);
  applyLang();
});
window.addEventListener("gamepadconnected", () => { pollPads(); renderPadPanel(); });
window.addEventListener("gamepaddisconnected", () => { pollPads(); renderPadPanel(); });

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-h]").forEach((el) => { el.innerHTML = t(el.dataset.h); });   // own texts only
  document.querySelectorAll("[data-ta]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.ta)); el.title = t(el.dataset.ta); });
  $("lang").textContent = t("otherLang");
  renderFreeze();
  $("vMtTime").textContent = num(settings.mtTime / 1000, 1) + " s";
  renderPadPanel(); renderPanels(); renderLog(); render();
}

// ===== start ===============================================================================
buildMotorSvg();
buildPlots();
showPanel(settings.panel || "pad");
applyLang();
connect();
setInterval(controlTick, SEND_MS);
setInterval(render, 100);
setInterval(() => { renderDrone(); renderMotors(); if (rec.cur) renderRec(); if (settings.panel === "tune") renderGains(); }, 500);
requestAnimationFrame(frame);
</script>
</body>
</html>
