<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Drone control</title>

<style>
:root{--bg:#0b0f14;--panel:#141b24;--line:#263241;--text:#e6edf3;--dim:#8b9bb0;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff;--knob:#c9d1d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;touch-action:manipulation}
button:disabled{opacity:.45}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar button{padding:5px 10px;font-size:13px}
#bar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:#0e141b;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
#bar .grow{flex:1}
#msg{min-height:28px;padding:4px 10px;text-align:center;font-weight:600;transition:background .2s}
#msg.info{color:var(--dim)}#msg.warn{background:#3a2a07;color:#ffd479}#msg.bad{background:#4a1214;color:#ffb3b0}#msg.ok{color:var(--ok)}
#main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 14px 12px}
.stick{position:relative;justify-self:center;width:min(42vw,62vh,330px);aspect-ratio:1;border-radius:22px;background:radial-gradient(circle at 50% 50%,#18212c 0,#121922 70%);border:1px solid var(--line)}
.stick::before,.stick::after{content:"";position:absolute;background:var(--line)}
.stick::before{left:50%;top:8%;bottom:8%;width:1px}.stick::after{top:50%;left:8%;right:8%;height:1px}
.knob{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;margin:-13% 0 0 -13%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--knob) 45%,#8a96a3);box-shadow:0 4px 14px #0009;will-change:transform}
.stick .lbl{position:absolute;top:6px;width:100%;text-align:center;color:var(--dim);font-size:12px;pointer-events:none}
#mid{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:150px}
#arm{width:150px;height:56px;font-weight:700;position:relative;overflow:hidden}
#arm .fill{position:absolute;inset:0;width:0;background:#2a4d2e}
#arm span{position:relative}
#arm.armed{background:#5a1d1d;border-color:var(--bad)}
#kill{width:150px;height:64px;font-weight:800;font-size:18px;background:#b42318;border-color:#ff6b5e;color:#fff;letter-spacing:.5px}
#horizon{width:110px;height:110px;border-radius:50%;overflow:hidden;position:relative;border:1px solid var(--line);background:#5b3a1e}
#sky{position:absolute;left:-50%;top:-50%;width:200%;height:100%;background:#2b5f8f;transform-origin:50% 100%}
#hz-mark{position:absolute;left:30%;right:30%;top:50%;height:2px;background:#ffd479}
#stats{color:var(--dim);font-size:12px;text-align:center;font-variant-numeric:tabular-nums;white-space:pre-line}
#trim{display:none;grid-template-columns:40px 62px 40px;grid-template-rows:repeat(3,35px);gap:3px}
#trim button{padding:0;font-size:15px;border-radius:8px}
#trimVal{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.3;color:var(--dim);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:8px;background:#0e141b}
#trimVal.set{color:#ffd479}
#mid.trimming #horizon{display:none}
#mid.trimming #trim{display:grid}
#trimBtn.on{background:#1f3a5a;border-color:var(--accent)}
#rotate,#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0f14f2;z-index:5;padding:20px;text-align:center}
#dlg .box{max-width:560px;max-height:90vh;overflow:auto;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;user-select:text;-webkit-user-select:text;touch-action:pan-y}
#dlg h2{margin:.2em 0 .5em;font-size:18px}#dlg p{margin:.5em 0;color:#c8d1db}#dlg small{color:var(--dim)}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="pill"><span id="cdot" class="dot"></span><span id="ctext" data-t="connecting"></span></span>
    <span class="pill" id="bat" data-t="batteryNone"></span>
    <span class="pill" id="state" data-t="disarmed"></span>
    <span class="grow"></span>
    <button id="trimBtn" data-t="trim"></button>
    <button id="fs" data-t="fullscreen"></button>
    <button id="info" data-t="info"></button>
    <button id="lang"></button>
  </div>
  <div id="msg" class="info" data-t="joinWifi"></div>
  <div id="main">
    <div class="stick" id="left"><div class="knob"></div><div class="lbl" data-t="leftStick"></div></div>
    <div id="mid">
      <button id="arm" disabled><div class="fill"></div><span data-t="notReady"></span></button>
      <div id="horizon"><div id="sky"></div><div id="hz-mark"></div></div>
      <div id="trim">
        <span></span><button data-ax="p" data-d="1" data-ta="trimUp">▲</button><span></span>
        <button data-ax="r" data-d="-1" data-ta="trimLeft">◀</button><div id="trimVal"><span id="trimR"></span><span id="trimP"></span></div><button data-ax="r" data-d="1" data-ta="trimRight">▶</button>
        <span></span><button data-ax="p" data-d="-1" data-ta="trimDown">▼</button><span></span>
      </div>
      <div id="stats">–</div>
      <button id="kill" data-t="kill"></button>
    </div>
    <div class="stick" id="right"><div class="knob"></div><div class="lbl" data-t="rightStick"></div></div>
  </div>
</div>
<div id="rotate"><div><p style="font-size:42px;margin:0">⟳</p><p data-t="rotate"></p></div></div>
<div id="dlg"><div class="box">
  <h2 data-t="title"></h2>
  <p id="dinfo">–</p>
  <p data-h="helpControls"></p>
  <p><span data-h="helpLink"></span> (<span id="dfs">–</span>).</p>
  <p data-h="helpTrim"></p>
  <p><span data-h="helpBattery"></span> <span id="dbat">–</span></p>
  <p data-h="helpSafety"></p>
  <p><small data-t="license"></small></p>
  <p style="text-align:right"><button id="dclose" data-t="close"></button></p>
</div></div>
<script>
"use strict";
// ---- protocol (docs/webcontrol.md) --------------------------------------
const PROTO = 2, MSG_CONTROL = 1, MSG_HELLO = 2, MSG_TRIM = 3, MSG_TELEMETRY = 0x81, TELEMETRY_LEN = 40;
const F_ARM = 1, F_KILL = 2, F_PAUSE = 4;
const S_ARMED = 1, S_YOU = 2, S_OTHER = 4, S_FAILSAFE = 8, S_LOWBAT = 16, S_BLOCKED = 32, S_READY = 64, S_TUMBLED = 128;
const S2_BAT_LAND = 1, S2_BAT_NOARM = 2;
const STOP_BATTERY = 5;
const TRIM_STEP = 5;   // 0.5° in 1/10°
const SEND_MS = 20, TELEMETRY_WARN_MS = 600, TELEMETRY_DEAD_MS = 2500;
const EXPO = 0.35, DEADBAND = 0.04;

// ---- texts ---------------------------------------------------------------
// English by default, German on German phones, switchable in the bar. The page
// translates itself because the captive portal window has no translate button.
// Values are strings, arrays or functions; data-h texts may contain markup.
const TEXT = {
  en: {
    title: "Drone control", connecting: "Connecting…", disconnected: "Disconnected", poorLink: "Poor link",
    batteryNone: "Battery –", disarmed: "Disarmed", armedState: "ARMED", otherPilot: "Other pilot", notReady: "Not ready",
    trim: "Trim", fullscreen: "Fullscreen", info: "Info", close: "Close", otherLang: "DE",
    joinWifi: "Join the drone's Wi-Fi…", leftStick: "Throttle · Yaw", rightStick: "Pitch · Roll",
    rotate: "Please hold the phone sideways.",
    arm: "Arm", disarm: "Disarm", inUse: "In use", batteryEmpty: "Battery empty",
    kill: "STOP", killSent: "STOP sent – motors off",
    trimUp: "Trim forward", trimDown: "Trim backward", trimLeft: "Trim left", trimRight: "Trim right",
    trimLimit: "Trim at its limit (±5°)", trimReset: "Trim reset to 0", roll: "R", pitch: "P",
    stats: (s) => `R ${s.roll}° P ${s.pitch}° · thrust ${s.thrust} %\ndelay ${s.delay} ms · dropped ${s.stale} · ${s.rate}/s`,
    stages: ["", "Short gap – holding the last command", "Link lost – drone is levelling out",
      "Link lost – drone is descending", "Motors off"],
    armReasons: ["", "Drone not ready (self test or calibration – keep it still)", "Throttle all the way down to arm",
      "Battery too low", "Another controller is active (app, cfclient, other phone)", "Drone is upside down",
      "Release first, then arm again"],
    stopReasons: ["", "Disarmed", "STOP – motors off", "Link lost – motors off, arm again",
      "Drone was upside down – motors off", "Battery empty – landed, please charge", "Disarmed by another controller"],
    motorsOff: "Motors off – arm again", disarmedToast: "Disarmed",
    msgPoorLink: "Poor link – the drone takes over shortly", msgNoLink: "No connection – looking for the drone…",
    msgBatLand: "Battery empty – the drone is landing. Throttle down after touchdown",
    msgTumbled: "Drone is upside down", msgBatLow: "Battery low – land soon", msgBatEmpty: "Battery empty – please charge",
    msgOther: "Someone else is flying", msgCalibrating: "Calibrating – keep the drone still",
    msgFlying: "Ready – have fun", msgIdle: "Throttle down, then hold “Arm” for 1 s",
    dinfo: (j) => `${j.device || "Drone"} · firmware ${j.fw || "?"} · protocol ${j.proto} · max ${j.maxAngle}° / ${j.maxYawRate}°/s`,
    dfs: (f) => `hold up to ${f.hold} ms, level out up to ${f.descend} ms, motors off after ${f.off} ms; ` +
      `commands older than ${f.stale} ms are dropped`,
    dbat: (b, volt) => (b.land ? `If the voltage drops below ${volt(b.land)} in flight, the drone lands by itself: ` +
      `you keep steering, but the thrust goes down to zero within ${Math.round(b.landTime / 1000)} s. ` +
      "Throttle down after touchdown." : "Automatic landing is switched off.") +
      (b.arm ? ` Below ${volt(b.arm)} it cannot be armed.` : ""),
    helpControls: "<b>Controls:</b> Left stick: up/down = throttle (stays where you leave it), left/right = turn. " +
      "Right stick: forward/back and sideways. To arm, pull the throttle all the way down and hold “Arm” for " +
      "1&nbsp;second. STOP turns the motors off at once, no matter who is flying.",
    helpLink: "<b>Link loss:</b> The drone bridges short gaps; after that it levels out, descends and turns the motors off",
    helpTrim: "<b>Trim:</b> If the drone drifts sideways by itself while hovering, tap “Trim” and correct with the " +
      "arrows (0.5° per tap, up to ±5°): if it drifts to the right, tap ◀. A long press on the middle resets to 0. " +
      "The drone stores the values; in flight only the pilot may trim.",
    helpBattery: "<b>Battery:</b>",
    helpSafety: "<b>Safety:</b> Propellers can injure. Only fly in a safe place and keep away from people.",
    license: "ESP-Drone web control · Copyright © 2026 Philipp Weber. Based on ESP-Drone (© Espressif Systems) " +
      "and the Crazyflie firmware (© Bitcraze AB). This program is free software under the GNU General Public " +
      "License version 3 and comes WITHOUT ANY WARRANTY. You may redistribute and modify it under the terms of " +
      "the license. License text: https://www.gnu.org/licenses/gpl-3.0.html · Source code: see the project's " +
      "repository (file LICENSE).",
  },
  de: {
    title: "Drohnensteuerung", connecting: "Verbinde…", disconnected: "Getrennt", poorLink: "Gestört",
    batteryNone: "Akku –", disarmed: "Gesperrt", armedState: "SCHARF", otherPilot: "Fremd­steuerung", notReady: "Nicht bereit",
    trim: "Trimm", fullscreen: "Vollbild", info: "Info", close: "Schließen", otherLang: "EN",
    joinWifi: "Mit dem Drohnen-WLAN verbinden…", leftStick: "Gas · Gieren", rightStick: "Nicken · Rollen",
    rotate: "Bitte das Handy quer halten.",
    arm: "Scharfschalten", disarm: "Entschärfen", inUse: "Belegt", batteryEmpty: "Akku leer",
    kill: "NOT-AUS", killSent: "NOT-AUS gesendet",
    trimUp: "Trimm vorwärts", trimDown: "Trimm rückwärts", trimLeft: "Trimm links", trimRight: "Trimm rechts",
    trimLimit: "Trimmung am Anschlag (±5°)", trimReset: "Trimmung auf 0 gesetzt", roll: "R", pitch: "N",
    stats: (s) => `R ${s.roll}° N ${s.pitch}° · Schub ${s.thrust} %\nVerzög. ${s.delay} ms · verworfen ${s.stale} · ${s.rate}/s`,
    stages: ["", "Aussetzer – letzter Befehl wird gehalten", "Verbindung weg – Drohne richtet sich gerade aus",
      "Verbindung weg – Drohne sinkt ab", "Motoren aus"],
    armReasons: ["", "Drohne nicht bereit (Selbsttest/Kalibrierung, Drohne still hinstellen)",
      "Gas ganz runter zum Scharfschalten", "Akku zu schwach", "Andere Steuerung aktiv (App/cfclient/anderes Handy)",
      "Drohne liegt auf dem Kopf", "Erst loslassen, dann neu scharfschalten"],
    stopReasons: ["", "Entschärft", "NOT-AUS – Motoren aus", "Verbindung verloren – Motoren aus, neu scharfschalten",
      "Drohne lag auf dem Kopf – Motoren aus", "Akku leer – gelandet, bitte laden", "Andere Steuerung hat entschärft"],
    motorsOff: "Motoren aus – neu scharfschalten", disarmedToast: "Entschärft",
    msgPoorLink: "Verbindung gestört – Drohne übernimmt nach kurzer Zeit selbst",
    msgNoLink: "Keine Verbindung – suche Drohne…",
    msgBatLand: "Akku leer – Drohne landet. Nach dem Aufsetzen Gas ganz runter",
    msgTumbled: "Drohne liegt auf dem Kopf", msgBatLow: "Akku schwach – bitte bald landen",
    msgBatEmpty: "Akku leer – bitte laden", msgOther: "Eine andere Steuerung fliegt gerade",
    msgCalibrating: "Drohne kalibriert – bitte still hinstellen", msgFlying: "Bereit – viel Spaß",
    msgIdle: "Gas runter, dann „Scharfschalten“ 1 s halten",
    dinfo: (j) => `${j.device || "Drohne"} · Firmware ${j.fw || "?"} · Protokoll ${j.proto} · max. ${j.maxAngle}° / ${j.maxYawRate}°/s`,
    dfs: (f) => `halten bis ${f.hold} ms, gerade ausrichten bis ${f.descend} ms, Motoren aus nach ${f.off} ms; ` +
      `Befehle älter als ${f.stale} ms werden verworfen`,
    dbat: (b, volt) => (b.land ? `Fällt die Spannung im Flug unter ${volt(b.land)}, landet die Drohne von selbst: ` +
      `Du lenkst weiter, aber der Schub sinkt in ${Math.round(b.landTime / 1000)} s auf null. ` +
      "Nach dem Aufsetzen Gas ganz runter." : "Automatisches Landen ist abgeschaltet.") +
      (b.arm ? ` Unter ${volt(b.arm)} lässt sie sich nicht scharfschalten.` : ""),
    helpControls: "<b>Bedienung:</b> Linker Stick: hoch/runter = Gas (bleibt stehen), links/rechts = drehen. " +
      "Rechter Stick: vor/zurück und seitwärts. Zum Scharfschalten Gas ganz runter und „Scharfschalten“ " +
      "1&nbsp;Sekunde halten. NOT-AUS stoppt die Motoren sofort, egal wer steuert.",
    helpLink: "<b>Verbindungsverlust:</b> Kurze Aussetzer überbrückt die Drohne, danach richtet sie sich gerade aus, " +
      "sinkt ab und schaltet die Motoren ab",
    helpTrim: "<b>Trimmen:</b> Driftet die Drohne beim Schweben von allein zur Seite, „Trimm“ antippen und mit den " +
      "Pfeilen gegensteuern (je 0,5°, höchstens ±5°): Driftet sie nach rechts, ◀ tippen. Lange auf die Mitte " +
      "drücken setzt auf 0. Die Drohne speichert die Werte selbst; im Flug darf nur der Pilot trimmen.",
    helpBattery: "<b>Akku:</b>",
    helpSafety: "<b>Sicherheit:</b> Propeller können verletzen. Nur in sicherer Umgebung fliegen, Abstand zu Personen halten.",
    license: "ESP-Drone Web Control · Copyright © 2026 Philipp Weber. Basiert auf ESP-Drone (© Espressif Systems) " +
      "und der Crazyflie-Firmware (© Bitcraze AB). Dieses Programm ist freie Software unter der GNU General Public " +
      "License Version 3 und wird OHNE JEDE GEWÄHRLEISTUNG bereitgestellt. Sie dürfen es unter den Bedingungen der " +
      "Lizenz weitergeben und verändern. Lizenztext: https://www.gnu.org/licenses/gpl-3.0.html · Quellcode: siehe " +
      "Repository des Projekts (Datei LICENSE).",
  },
};

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
};
const ms32 = () => (Math.floor(performance.now()) >>> 0);

function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (TEXT[q]) return q;
  try { const s = localStorage.getItem("wc_lang"); if (TEXT[s]) return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";
}
let lang = pickLang();
const t = k => (k in TEXT[lang]) ? TEXT[lang][k] : TEXT.en[k];
const num = (v, digits) => { const s = v.toFixed(digits); return lang === "de" ? s.replace(".", ",") : s; };

// ---- state ---------------------------------------------------------------
let ws = null, wsOpen = false, ready = false, infoSeen = false, reconnectDelay = 250, reconnectTimer = 0;
let seq = 0, sent = 0, skipped = 0;
let lastTel = 0, tel = null, info = null, rtt = -1;
let armReq = false, armSince = 0, killUntil = 0, paused = false;
let token = (store.get("wc_token") | 0) >>> 0;
const sticks = { thr: 0, yaw: 0, pitch: 0, roll: 0 };
// Throttle of a session that may still be flying (page reloaded mid-air). It is
// only applied once the drone confirms that it resumed this session.
const savedThr = parseFloat(store.get("wc_thr"));
let resumeThr = (token && savedThr >= 0 && savedThr <= 1) ? savedThr : null;

// ---- sticks --------------------------------------------------------------
function expo(v) {
  const s = Math.sign(v), a = Math.abs(v);
  if (a < DEADBAND) return 0;
  const x = (a - DEADBAND) / (1 - DEADBAND);
  return s * ((1 - EXPO) * x + EXPO * x * x * x);
}
function makeStick(el, onMove, onRelease) {
  const knob = el.querySelector(".knob");
  let id = null;
  // knob travel: 37 % of the pad = 37/26 = 1.42 knob widths
  const set = (x, y) => { knob.style.transform = `translate(${x * 142}%, ${y * 142}%)`; };
  const pos = e => {
    const r = el.getBoundingClientRect();
    let x = (e.clientX - r.left) / r.width * 2 - 1, y = (e.clientY - r.top) / r.height * 2 - 1;
    x = Math.max(-1, Math.min(1, x / 0.74)); y = Math.max(-1, Math.min(1, y / 0.74));
    return [x, y];
  };
  el.addEventListener("pointerdown", e => { if (id !== null) return; id = e.pointerId; el.setPointerCapture(id); const [x, y] = pos(e); onMove(x, y); });
  el.addEventListener("pointermove", e => { if (e.pointerId !== id) return; const [x, y] = pos(e); onMove(x, y); });
  const end = e => { if (e.pointerId !== id) return; id = null; onRelease(); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("lostpointercapture", end);
  return set;
}
const setLeft = makeStick($("left"), (x, y) => {
  sticks.yaw = x; sticks.thr = Math.max(0, Math.min(1, (1 - y) / 2));
  store.set("wc_thr", sticks.thr.toFixed(3)); drawLeft();
}, () => { sticks.yaw = 0; drawLeft(); });       // throttle stays where it is
const setRight = makeStick($("right"), (x, y) => { sticks.roll = x; sticks.pitch = -y; drawRight(); },
  () => { sticks.roll = 0; sticks.pitch = 0; drawRight(); });
function drawLeft() { setLeft(sticks.yaw, 1 - 2 * sticks.thr); }
function drawRight() { setRight(sticks.roll, -sticks.pitch); }
drawLeft(); drawRight();

// ---- WebSocket -----------------------------------------------------------
function wsUrl() {
  // ?host=IP or ?host=IP:PORT (e.g. tools/mock_drone.py), default: this page's host, port 81
  const q = new URLSearchParams(location.search).get("host");
  if (q && q.includes(":")) return `ws://${q}/ws`;
  return `ws://${q || location.hostname || "192.168.43.42"}:81/ws`;
}
function connect() {
  clearTimeout(reconnectTimer);
  ready = false; infoSeen = false; wsOpen = false;
  try { ws = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    wsOpen = true; reconnectDelay = 250; lastTel = performance.now();
    const b = new DataView(new ArrayBuffer(8));
    b.setUint8(0, MSG_HELLO); b.setUint8(1, PROTO); b.setUint32(4, token, true);
    ws.send(b.buffer);
  };
  ws.onmessage = ev => {
    if (typeof ev.data === "string") { try { const j = JSON.parse(ev.data); if (j.t === "info") onInfo(j); } catch (e) {} return; }
    if (ev.data.byteLength >= TELEMETRY_LEN) onTelemetry(new DataView(ev.data));
  };
  ws.onclose = () => { wsOpen = false; ready = false; scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(2000, reconnectDelay * 2);
}
function onInfo(j) {
  info = j; infoSeen = true;   // the drone has processed our HELLO
  renderInfo();
}
function renderInfo() {
  if (!info) return;
  const volt = mv => num(mv / 1000, 1) + " V";
  $("dinfo").textContent = t("dinfo")(info);
  $("dfs").textContent = t("dfs")(info.failsafe || {});
  $("dbat").textContent = t("dbat")(info.battery || {}, volt);
}
function onTelemetry(v) {
  // Only telemetry after the answer to HELLO tells whether our session was resumed.
  if (v.getUint8(0) !== MSG_TELEMETRY || !infoSeen) return;
  const tm = {
    state: v.getUint8(1), stage: v.getUint8(2), armResult: v.getUint8(3), echoSeq: v.getUint16(4, true),
    rxRate: v.getUint16(6, true), echoMs: v.getUint32(8, true), vbat: v.getUint16(12, true) / 1000,
    roll: v.getInt16(14, true) / 100, pitch: v.getInt16(16, true) / 100, yaw: v.getInt16(18, true) / 100,
    thrust: v.getUint16(20, true) / 1000, stale: v.getUint16(22, true), delay: v.getUint16(24, true),
    state2: v.getUint8(26), stopReason: v.getUint8(27),
    uptime: v.getUint32(28, true), token: v.getUint32(32, true), trimR: v.getInt8(36), trimP: v.getInt8(37),
  };
  const now = performance.now();
  const wasFlying = !!(tel && (tel.state & S_ARMED) && (tel.state & S_YOU));
  lastTel = now; tel = tm;
  const r = (ms32() - tm.echoMs) >>> 0;
  if (tm.echoMs && r < 10000) rtt = rtt < 0 ? r : rtt * 0.8 + r * 0.2;

  if (tm.token) { token = tm.token; store.set("wc_token", String(token)); }
  const flying = (tm.state & S_ARMED) && (tm.state & S_YOU);
  // Why the drone stopped. After a stop the drone also answers "release ARM
  // first" to our ARM flag, so the stop reason wins when we were flying.
  const stopText = (tm.stopReason > 1 && t("stopReasons")[tm.stopReason]) || "";
  const stopCls = tm.stopReason === STOP_BATTERY ? "bad" : "warn";
  if (!ready) {
    // first telemetry after (re)connect: take over the drone's view of the arm state
    if (armReq && !flying && stopText) toast(stopText, stopCls);
    armReq = !!flying; ready = true;
    if (resumeThr !== null) { sticks.thr = flying ? resumeThr : 0; resumeThr = null; drawLeft(); }
  } else if (armReq && !flying && now - armSince > 600) {
    armReq = false;
    if (wasFlying && stopText) toast(stopText, stopCls);
    else if (tm.armResult) toast(t("armReasons")[tm.armResult], "warn");
    else toast((tm.state & S_BLOCKED) ? t("motorsOff") : t("disarmedToast"), "warn");
  }
  if (!flying && !armReq && token) { token = 0; store.set("wc_token", "0"); }
  render();
}

// ---- send loop -----------------------------------------------------------
function sendControl(extraFlags, force) {
  if (!ws || !wsOpen || (!ready && !force)) return;
  if (ws.bufferedAmount > 0 && !force) { skipped++; return; }   // never queue old commands
  const now = performance.now();
  let flags = extraFlags | 0;
  if (armReq) flags |= F_ARM;
  if (now < killUntil) flags |= F_KILL;
  const b = new DataView(new ArrayBuffer(16));
  b.setUint8(0, MSG_CONTROL); b.setUint8(1, flags); b.setUint16(2, seq, true); b.setUint32(4, ms32(), true);
  b.setInt16(8, Math.round(expo(sticks.roll) * 1000), true);
  b.setInt16(10, Math.round(expo(sticks.pitch) * 1000), true);
  b.setInt16(12, Math.round(expo(sticks.yaw) * 1000), true);
  b.setUint16(14, Math.round(sticks.thr * 1000), true);
  ws.send(b.buffer);
  seq = (seq + 1) & 0xffff; sent++;
}
setInterval(() => {
  const now = performance.now();
  if (wsOpen && now - lastTel > TELEMETRY_DEAD_MS) { try { ws.close(); } catch (e) {} }  // stalled TCP: start fresh
  if (!paused) sendControl(0);
}, SEND_MS);
document.addEventListener("visibilitychange", () => {
  paused = document.hidden;
  if (paused) sendControl(F_PAUSE);     // drone levels out right away
});
window.addEventListener("pagehide", () => sendControl(F_PAUSE));

// ---- buttons ---------------------------------------------------------------
let holdTimer = 0, holdStart = 0;
const armBtn = $("arm"), fill = armBtn.querySelector(".fill");
armBtn.addEventListener("pointerdown", e => {
  if (armReq) { armReq = false; render(); return; }      // disarm: one tap
  if (sticks.thr > 0.02) { toast(t("armReasons")[2], "warn"); return; }
  holdStart = performance.now();
  holdTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - holdStart) / 1000);
    fill.style.width = (p * 100) + "%";
    if (p >= 1) { stopHold(); armReq = true; armSince = performance.now(); buzz(40); render(); }
  }, 30);
});
function stopHold() { clearInterval(holdTimer); holdTimer = 0; fill.style.width = "0"; }
["pointerup", "pointercancel", "pointerleave"].forEach(ev => armBtn.addEventListener(ev, stopHold));
$("kill").addEventListener("pointerdown", () => {
  armReq = false; killUntil = performance.now() + 400; buzz([80, 40, 80]);
  sendControl(F_KILL, true); toast(t("killSent"), "bad");
});
// ---- trim (stored on the drone, shown from the telemetry) -----------------
let trimShown = null, trimPendingUntil = 0, trimResetTimer = 0;
function trimNow() {
  if (trimShown && performance.now() < trimPendingUntil) return trimShown;   // sent, not yet confirmed
  return tel ? { r: tel.trimR, p: tel.trimP } : { r: 0, p: 0 };
}
function trimAllowed() {   // in flight only the pilot may trim, as on the drone
  return wsOpen && infoSeen && tel && performance.now() - lastTel < TELEMETRY_WARN_MS && !((tel.state & S_ARMED) && !(tel.state & S_YOU));
}
function sendTrim(r, p) {
  if (!trimAllowed()) return false;
  const b = new DataView(new ArrayBuffer(4));
  b.setUint8(0, MSG_TRIM); b.setInt8(1, r); b.setInt8(2, p);
  ws.send(b.buffer);
  trimShown = { r, p }; trimPendingUntil = performance.now() + 1000;
  renderTrim();
  return true;
}
document.querySelectorAll("#trim button").forEach(btn => btn.addEventListener("pointerdown", e => {
  e.preventDefault();
  const cur = trimNow(), max = (info && info.trimMax) || 50, d = Number(btn.dataset.d) * TRIM_STEP;
  const r = btn.dataset.ax === "r" ? Math.max(-max, Math.min(max, cur.r + d)) : cur.r;
  const p = btn.dataset.ax === "p" ? Math.max(-max, Math.min(max, cur.p + d)) : cur.p;
  if (r === cur.r && p === cur.p) { buzz(60); toast(t("trimLimit"), "warn"); return; }
  if (sendTrim(r, p)) buzz(15);
}));
const trimVal = $("trimVal");
trimVal.addEventListener("pointerdown", () => {
  clearTimeout(trimResetTimer);
  trimResetTimer = setTimeout(() => { if (sendTrim(0, 0)) { buzz(40); toast(t("trimReset"), "info"); } }, 800);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => trimVal.addEventListener(ev, () => clearTimeout(trimResetTimer)));
$("trimBtn").onclick = () => {
  const on = $("mid").classList.toggle("trimming");
  $("trimBtn").classList.toggle("on", on);
  renderTrim();
};
function fmtTrim(v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v) / 10, 1) + "°"; }
function renderTrim() {
  const tr = trimNow(), set = tr.r !== 0 || tr.p !== 0, ok = trimAllowed();
  $("trimR").textContent = t("roll") + " " + fmtTrim(tr.r);
  $("trimP").textContent = t("pitch") + " " + fmtTrim(tr.p);
  trimVal.classList.toggle("set", set);
  document.querySelectorAll("#trim button").forEach(b => { b.disabled = !ok; });
  $("trimBtn").textContent = t("trim") + (set ? " •" : "");
}

$("info").onclick = () => { $("dlg").style.display = "flex"; };
$("dclose").onclick = () => { $("dlg").style.display = "none"; };
const fsBtn = $("fs");
if (!document.documentElement.requestFullscreen) fsBtn.style.display = "none";
fsBtn.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {})).catch(() => {});
};
$("lang").onclick = () => {
  lang = lang === "de" ? "en" : "de";
  try { localStorage.setItem("wc_lang", lang); } catch (e) {}
  applyLang();
};
document.addEventListener("contextmenu", e => e.preventDefault());

// ---- rendering -------------------------------------------------------------
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-h]").forEach(el => { el.innerHTML = t(el.dataset.h); });  // own texts only
  document.querySelectorAll("[data-ta]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.ta)); });
  $("lang").textContent = t("otherLang");
  toastUntil = 0;
  renderInfo();
  render();
}
let toastUntil = 0;
function toast(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls; toastUntil = performance.now() + 2500; }
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let lastBuzzStage = 0, lastBatLand = false;
function batteryPercent(v) {
  const tbl = [3.0, 3.78, 3.83, 3.87, 3.89, 3.92, 3.96, 4.0, 4.04, 4.1];
  if (v <= tbl[0]) return 0;
  for (let i = 1; i < tbl.length; i++) if (v < tbl[i]) return Math.round(10 * (i - 1 + (v - tbl[i - 1]) / (tbl[i] - tbl[i - 1])));
  return 100;
}
function render() {
  const now = performance.now();
  const age = now - lastTel;
  const live = wsOpen && tel && age < TELEMETRY_WARN_MS;
  $("cdot").className = "dot " + (live ? (rtt < 80 ? "ok" : "warn") : (wsOpen ? "warn" : ""));
  $("ctext").textContent = !wsOpen ? t("disconnected") : !live ? t("poorLink") : `${Math.round(rtt)} ms`;
  renderTrim();
  if (!tel) return;
  const s = tel.state, s2 = tel.state2, flying = (s & S_ARMED) && (s & S_YOU);
  $("bat").textContent = tel.vbat > 0 ? `${num(tel.vbat, 2)} V · ${batteryPercent(tel.vbat)} %` : t("batteryNone");
  $("bat").style.color = ((s & S_LOWBAT) || (s2 & (S2_BAT_LAND | S2_BAT_NOARM))) ? "var(--bad)" : "";
  $("state").textContent = flying ? t("armedState") : (s & S_OTHER) ? t("otherPilot") : (s & S_READY) ? t("disarmed") : t("notReady");
  $("state").style.color = flying ? "var(--bad)" : "";
  $("sky").style.transform = `translateY(${Math.max(-40, Math.min(40, tel.pitch)) * 1.2}%) rotate(${-tel.roll}deg)`;
  $("stats").textContent = t("stats")({ roll: tel.roll.toFixed(0), pitch: tel.pitch.toFixed(0), thrust: Math.round(tel.thrust * 100),
    delay: tel.delay, stale: tel.stale, rate: tel.rxRate });

  const label = armBtn.querySelector("span");
  armBtn.classList.toggle("armed", armReq);
  if (armReq) { label.textContent = t("disarm"); armBtn.disabled = false; }
  else if (!(s & S_READY)) { label.textContent = t("notReady"); armBtn.disabled = true; }
  else if (s & S_OTHER) { label.textContent = t("inUse"); armBtn.disabled = true; }
  else if (s2 & S2_BAT_NOARM) { label.textContent = t("batteryEmpty"); armBtn.disabled = true; }
  else { label.textContent = t("arm"); armBtn.disabled = false; }

  const batLand = !!(flying && (s2 & S2_BAT_LAND));
  if (batLand && !lastBatLand) buzz([300, 100, 300, 100, 300]);
  lastBatLand = batLand;
  if (now < toastUntil) return;
  const m = $("msg");
  let text = "", cls = "info";
  if (!live) { text = wsOpen ? t("msgPoorLink") : t("msgNoLink"); cls = "bad"; }
  else if (flying && tel.stage >= 1) { text = t("stages")[tel.stage]; cls = tel.stage >= 2 ? "bad" : "warn"; }
  else if (batLand) { text = t("msgBatLand"); cls = "bad"; }
  else if (s & S_TUMBLED) { text = t("msgTumbled"); cls = "bad"; }
  else if (flying && (s & S_LOWBAT)) { text = t("msgBatLow"); cls = "warn"; }
  else if (!flying && ((s2 & S2_BAT_NOARM) || (s & S_LOWBAT))) { text = t("msgBatEmpty"); cls = "warn"; }
  else if (s & S_OTHER) { text = t("msgOther"); cls = "warn"; }
  else if (!(s & S_READY)) { text = t("msgCalibrating"); cls = "warn"; }
  else if (flying) { text = t("msgFlying"); cls = "ok"; }
  else { text = t("msgIdle"); cls = "info"; }
  m.textContent = text; m.className = cls;
  const st = flying ? tel.stage : 0;
  if (st >= 2 && lastBuzzStage < 2) buzz([200, 100, 200]);
  lastBuzzStage = st;
}
applyLang();
setInterval(render, 100);
connect();
</script>
</body>
</html>
