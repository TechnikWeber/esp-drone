name: Build project

on:
  push:
    branches:
      - master
      - webcontrol
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests of the web control core
        run: make -C components/webctrl/host_test
      - name: Python tools
        run: python3 -m py_compile tools/*.py tools/groundstation/*.py tools/web_flasher/*.py
      - name: Scripts of the control page and the ground station
        run: |
          for page in components/webctrl/web/index.html tools/groundstation/index.html; do
            sed -n '/<script>/,/<\/script>/p' "$page" | sed '1d;$d' > /tmp/page.js
            node --check /tmp/page.js
          done

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - idf_ver: release-v5.5
            target: esp32
            preview: ""
          - idf_ver: release-v5.5
            target: esp32s2
            preview: ""
          - idf_ver: release-v5.5
            target: esp32s3
            preview: ""
          - idf_ver: release-v5.5
            target: esp32p4
            preview: ""
          - idf_ver: release-v6.1
            target: esp32
            preview: ""
          - idf_ver: release-v6.1
            target: esp32s2
            preview: ""
          - idf_ver: release-v6.1
            target: esp32s3
            preview: ""
          - idf_ver: release-v6.1
            target: esp32p4
            preview: ""
          - idf_ver: release-v6.1
            target: esp32s31
            preview: "--preview"
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf_ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Build ${{ matrix.target }} with ESP-IDF ${{ matrix.idf_ver }}
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          idf.py ${{ matrix.preview }} \
            -B build-${{ matrix.target }} \
            -D IDF_TARGET=${{ matrix.target }} \
            build
